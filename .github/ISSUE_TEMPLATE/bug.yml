name: Bug report
description: Report a reproducible Vega defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach proprietary game assets or security-sensitive reproductions.
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@haneoka/vega 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Engine or command interpreter
        - Vue adapter
        - React adapter
        - Web Component adapter
        - Preview protocol
        - Deneb runtime bundle
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, environment, and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: lifecycle
    attributes:
      label: Lifecycle evidence
      description: Note seek/reload/dispose behavior, console errors, and retained resources if relevant.
