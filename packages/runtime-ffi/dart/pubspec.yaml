name: vega_runtime_ffi
description: Vega Rust execution core through the platform C ABI.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.5
dependencies:
  ffi: ^2.2.0
  vega_protocol:
    path: ../../protocol/dart
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
