name: vega_runtime_ffi
description: Vega Rust execution core through the platform C ABI.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.5
dependencies:
  ffi: ^2.2.0
  vega_protocol:
    git:
      url: https://github.com/haneoka-gakuen/vega.git
      ref: 4aa5e3a76c540e142be75293d4d34463c138f3d0
      path: packages/protocol/dart
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
